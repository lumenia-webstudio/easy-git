<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  /* Gabarit de l'image de partage (img/og.jpg), rendu par Chrome headless en 1200 × 630 */
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; display: flex; align-items: center; }
  .og > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: right center; }
  .og div { position: relative; padding-left: 72px; max-width: 640px; }
  .og h1 { font-size: 76px; margin: 0 0 18px; }
  .og p { font-size: 26px; color: var(--muted); margin: 0; }
</style></head>
<body><div class="og"><img src="img/hero.webp" alt="">
<div><p class="brand"><img src="img/icon.svg" alt="" width="52" height="52"> Easy Git</p>
<h1>Git, sans la peur du terminal.</h1><p>Client GitHub gratuit pour débutants, sur Linux.</p></div></div></body></html>
